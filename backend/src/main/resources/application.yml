spring:
  application:
    name: pharma-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pharma
    username: pharma
    password: pharma
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-client-id
            client-secret: your-client-secret
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 6000

  cache:
    type: redis

server:
  servlet:
    context-path: /api/v1

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  auto-order:
    default-gln: 4819999999999

  jwt:
    secret: my-super-secret-key-which-is-long-enough-123456
    access-ttl: 3600000
    refresh-ttl: 86400000